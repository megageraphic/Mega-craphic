<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميجا جرافيك | تصميم مواقع المطاعم والكافيهات</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-hover: #AA820A;
            --text-light: #E0E0E0;
            --border-gold: rgba(212, 175, 55, 0.3);
            --telegram-color: #24A1DE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        header {
            background-color: #000000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--gold-primary);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.8rem 2rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .header-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFFFFF;
        }

        .logo-text span {
            color: var(--gold-primary);
        }

        .back-btn {
            text-decoration: none;
            color: var(--gold-light);
            font-weight: 700;
            padding: 0.5rem 1.4rem;
            border-radius: 20px;
            border: 1px solid var(--gold-primary);
            background: rgba(212, 175, 55, 0.05);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            color: #000;
            background: var(--gold-primary);
        }

        .hero-banner {
            text-align: center;
            padding: 4rem 2rem;
            background: radial-gradient(circle at center, #1A1A1A 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border-gold);
        }

        .hero-banner h1 {
            font-size: 2.5rem;
            color: var(--gold-light);
            margin-bottom: 1rem;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .hero-banner p {
            font-size: 1.2rem;
            color: #AAA;
            max-width: 700px;
            margin: 0 auto;
        }

        .gallery-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2rem;
            color: var(--gold-primary);
            position: relative;
            display: inline-block;
        }

        .section-title h2::after {
            content: '';
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            position: absolute;
            bottom: -10px;
            right: 20%;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .gallery-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .gallery-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold-primary);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .gallery-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: #111;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover .gallery-img {
            transform: scale(1.05);
        }

        .gallery-info {
            padding: 1rem;
            text-align: center;
        }

        .gallery-info h4 {
            color: var(--gold-light);
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
        }

        .order-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            background-color: var(--telegram-color);
            color: #FFFFFF;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background-color 0.3s ease, transform 0.2s;
            text-decoration: none;
        }

        .order-btn:hover {
            background-color: #1a82b8;
            transform: scale(1.02);
        }

        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }

        .lightbox-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .lightbox-modal.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 25px;
            color: var(--gold-primary);
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: #FFFFFF;
        }

        .floating-buttons {
            position: fixed;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        .floating-back-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-primary) 0%, #AA820A 100%);
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
            z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .floating-back-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.8);
        }

        .floating-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #FFFFFF;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .floating-telegram {
            background-color: var(--telegram-color);
            box-shadow: 0 4px 15px rgba(36, 161, 222, 0.5);
        }

        .floating-call {
            background: linear-gradient(135deg, var(--gold-primary) 0%, #AA820A 100%);
            color: #000000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
        }

        .floating-btn:hover {
            transform: scale(1.1);
        }

        footer {
            background-color: #000000;
            color: var(--text-light);
            text-align: center;
            padding: 2rem;
            margin-top: 5rem;
            border-top: 1px solid var(--gold-primary);
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 1rem; }
            .hero-banner h1 { font-size: 1.8rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .gallery-img { height: 140px; }
            .floating-buttons { bottom: 15px; left: 15px; gap: 10px; }
            .floating-back-btn { bottom: 15px; right: 15px; width: 50px; height: 50px; font-size: 1.5rem; }
            .floating-btn { width: 50px; height: 50px; font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-container">
                <img src="100.png" alt="شعار ميجا جرافيك" class="header-logo">
                <span class="logo-text">ميجا <span>جرافيك</span></span>
            </a>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
        </nav>
    </header>

    <section class="hero-banner">
        <h1><i class="fa-solid fa-utensils"></i> تصميم مواقع المطاعم والكافيهات</h1>
        <p>نقدم أفضل الحلول المبتكرة لتصميم المنيو التفاعلي، وأنظمة الطلب أونلاين وحجوزات الطاولات باحترافية عالية لتعزيز مبيعات مطعمك.</p>
    </section>

    <section class="gallery-section">
        <div class="section-title">
            <h2>معرض أعمالنا ونماذج المنيو</h2>
        </div>

        <div class="gallery-grid" id="galleryContainer"></div>
    </section>

    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img src="" alt="معاينة الصورة" class="lightbox-content" id="lightboxImg">
    </div>

    <a href="index.html" class="floating-back-btn" title="الرجوع للصفحة الرئيسية">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="floating-buttons">
        <a href="tel:01010255123" class="floating-btn floating-call" title="إتصال هاتفي مباشر">
            <i class="fa-solid fa-phone"></i>
        </a>
        <a href="https://t.me/megagraphic_bot" target="_blank" class="floating-btn floating-telegram" title="تواصل عبر تليجرام">
            <i class="fa-brands fa-telegram"></i>
        </a>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 لموقع <strong>ميجا جرافيك</strong></p>
    </footer>

    <script>
        const galleryContainer = document.getElementById('galleryContainer');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');

        // اسم البوت الموثق الخاص بك
        const BOT_USERNAME = 'megagraphic_bot';

        function sendOrderToTelegram(designNumber) {
            const userPhone = prompt("الرجاء إدخال رقم هاتفك ليتواصل معك فريق ميجا جرافيك:");
            if (!userPhone) {
                alert("يرجى إدخال رقم الهاتف لإتمام الطلب.");
                return;
            }

            const fullImageUrl = window.location.origin + window.location.pathname.replace('restaurants.html', '') + `${designNumber}.png`;

            const message = `طلب تصميم جديد من الموقع!\n\nاسم التصميم: تصميم رقم ${designNumber}\nرقم العميل: ${userPhone}\nرابط التصميم: ${fullImageUrl}`;

            // تحويل العميل لمحادثة البوت مباشرة مع النص الجاهز للإرسال
            const telegramAppUrl = `https://t.me/${BOT_USERNAME}?text=${encodeURIComponent(message)}`;
            
            window.open(telegramAppUrl, '_blank');
        }

        for (let i = 10; i <= 50; i++) {
            const card = document.createElement('div');
            card.className = 'gallery-card';
            const imageSrc = `${i}.png`;

            card.innerHTML = `
                <img src="${imageSrc}" alt="نموذج ${i}" class="gallery-img" onerror="this.onerror=null; this.src='100.png';">
                <div class="gallery-info">
                    <h4>تصميم رقم ${i}</h4>
                    <button class="order-btn" onclick="event.stopPropagation(); sendOrderToTelegram(${i});">
                        <i class="fa-brands fa-telegram"></i> اطلب هذا
                    </button>
                </div>
            `;

            card.addEventListener('click', () => {
                lightboxImg.src = imageSrc;
                lightboxModal.classList.add('active');
            });

            galleryContainer.appendChild(card);
        }

        lightboxClose.addEventListener('click', () => {
            lightboxModal.classList.remove('active');
        });

        lightboxModal.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightboxModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
